<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUP2EAT – Eat Your Drink! | Luxury Edible Biscuit Cups</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF6F0; color: #23150E; }
    .font-serif-luxury { font-family: 'Playfair Display', serif; }
    @media print {
      body * { visibility: hidden; }
      #printable-invoice, #printable-invoice * { visibility: visible; }
      #printable-invoice { position: fixed; left: 0; top: 0; width: 100%; background: white; padding: 24px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const INITIAL_PRODUCTS = [
      {
        id: 'prod-choc',
        name: 'Dark Belgian Chocolate Edible Cups',
        flavour: 'Chocolate',
        tagline: 'Rich Cocoa Wafer • Holds Hot Espresso 45+ Mins',
        description: 'Crisp artisan wafer biscuit coated inside with velvety 70% Dark Belgian couverture chocolate. Holds piping hot espresso or cappuccino without softening.',
        basePrice: 349,
        rating: 4.9,
        reviews: 214,
        badge: 'Bestseller',
        stock: 48,
        sku: 'C2E-CHOC-01',
        accent: '#3B2314',
        packOptions: [
          { size: 'Box of 12', count: 12, multiplier: 1, label: '' },
          { size: 'Box of 24', count: 24, multiplier: 1.85, label: 'Save 8%' },
          { size: 'Café Pack of 50', count: 50, multiplier: 3.6, label: 'Save 14%' }
        ]
      },
      {
        id: 'prod-van',
        name: 'Madagascar Vanilla Edible Cups',
        flavour: 'Vanilla',
        tagline: 'Aromatic Vanilla Bean Crunch • Ideal for Lattes',
        description: 'Golden-baked crunchy biscuit cup infused with real Madagascar vanilla pods and a silky white-cocoa moisture barrier. Crafted for lattes, cappuccinos & gelato.',
        basePrice: 329,
        rating: 4.8,
        reviews: 168,
        badge: 'Café Favourite',
        stock: 36,
        sku: 'C2E-VAN-02',
        accent: '#C89B3C',
        packOptions: [
          { size: 'Box of 12', count: 12, multiplier: 1, label: '' },
          { size: 'Box of 24', count: 24, multiplier: 1.85, label: 'Save 8%' },
          { size: 'Café Pack of 50', count: 50, multiplier: 3.6, label: 'Save 14%' }
        ]
      },
      {
        id: 'prod-elai',
        name: 'Royal Elaichi Chai Edible Cups',
        flavour: 'Elaichi',
        tagline: 'Cardamom-Infused Crisp Biscuit • Crafted for Chai',
        description: 'Specially engineered for Indian masala chai and filter coffee lovers. Fragrant hand-crushed green cardamom baked into a crisp, leak-proof biscuit cup.',
        basePrice: 339,
        rating: 4.9,
        reviews: 302,
        badge: 'Desi Signature',
        stock: 19,
        sku: 'C2E-ELAI-03',
        accent: '#5B6E43',
        packOptions: [
          { size: 'Box of 12', count: 12, multiplier: 1, label: '' },
          { size: 'Box of 24', count: 24, multiplier: 1.85, label: 'Save 8%' },
          { size: 'Café Pack of 50', count: 50, multiplier: 3.6, label: 'Save 14%' }
        ]
      },
      {
        id: 'prod-assort',
        name: 'Signature Assorted Party Box',
        flavour: 'Assorted',
        tagline: 'Mix of Chocolate, Vanilla & Elaichi Cups',
        description: 'Experience the complete CUP2EAT artisan collection in one luxury rigid gift box. Ideal for house parties, corporate events, gifting & specialty cafés.',
        basePrice: 499,
        rating: 5.0,
        reviews: 189,
        badge: 'Gift & Event Pack',
        stock: 25,
        sku: 'C2E-ASST-04',
        accent: '#8C5228',
        packOptions: [
          { size: 'Box of 12', count: 12, multiplier: 1, label: '' },
          { size: 'Box of 24', count: 24, multiplier: 1.85, label: 'Save 8%' },
          { size: 'Café Pack of 50', count: 50, multiplier: 3.6, label: 'Save 14%' }
        ]
      }
    ];

    const INITIAL_ORDERS = [
      {
        id: 'C2E-84920',
        date: '12 Nov 2026, 09:30 AM',
        customerName: 'Aarav Sharma',
        customerPhone: '+91 98765 43210',
        address: 'B-402, Palm Grove Residency, Bandra West, Mumbai - 400050',
        paymentMethod: 'UPI Instant (Razorpay)',
        paymentId: 'pay_P9xK2mN84920',
        status: 'Dispatched via Courier',
        items: [
          { name: 'Dark Belgian Chocolate Edible Cups', packSize: 'Box of 24', qty: 1, unitPrice: 646 },
          { name: 'Royal Elaichi Chai Edible Cups', packSize: 'Box of 12', qty: 2, unitPrice: 339 }
        ],
        subtotal: 1324,
        discount: 132,
        gst: 60,
        total: 1252
      }
    ];

    const STAGES = ['Order Confirmed', 'Freshly Baked & Packed', 'Dispatched via Courier', 'Delivered'];

    function CupIllustration({ flavour, accent }) {
      return (
        <div className="relative w-full h-48 rounded-2xl flex items-center justify-center overflow-hidden" style={{ background: `linear-gradient(135deg, ${accent}18, ${accent}38)` }}>
          <svg viewBox="0 0 160 160" className="w-36 h-36 drop-shadow-xl">
            <defs>
              <linearGradient id={`cup-${flavour}`} x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stopColor="#E6B97A" />
                <stop offset="100%" stopColor="#B87D3B" />
              </linearGradient>
            </defs>
            {/* Steam */}
            <path d="M62 34 C58 24, 68 18, 64 10" stroke={accent} strokeWidth="2.5" strokeLinecap="round" fill="none" opacity="0.6" />
            <path d="M80 30 C76 20, 86 14, 82 6" stroke={accent} strokeWidth="2.5" strokeLinecap="round" fill="none" opacity="0.8" />
            <path d="M98 34 C94 24, 104 18, 100 10" stroke={accent} strokeWidth="2.5" strokeLinecap="round" fill="none" opacity="0.6" />
            {/* Handle */}
            <path d="M114 64 C134 64, 134 104, 110 104" stroke="#C58B47" strokeWidth="9" strokeLinecap="round" fill="none" />
            {/* Cup Body */}
            <path d="M44 52 L116 52 L106 122 C105 130, 96 135, 80 135 C64 135, 55 130, 54 122 Z" fill={`url(#cup-${flavour})`} />
            {/* Wafer Waffle Grid */}
            <path d="M52 72 L108 72 M54 92 L106 92 M56 112 L104 112 M68 54 L72 132 M80 54 L80 134 M92 54 L88 132" stroke="#8F5B25" strokeWidth="1.2" opacity="0.35" />
            {/* Rim & Drink */}
            <ellipse cx="80" cy="52" rx="36" ry="9" fill="#F3D3A2" />
            <ellipse cx="80" cy="52" rx="31" ry="6.5" fill={accent} />
            <ellipse cx="74" cy="51" rx="12" ry="2.2" fill="#FFFFFF" opacity="0.25" />
          </svg>
          <span className="absolute bottom-3 right-3 text-[11px] font-semibold tracking-wider uppercase px-2.5 py-1 rounded-full bg-white/90 text-[#23150E] shadow-sm">
            100% Edible Wafer
          </span>
        </div>
      );
    }

    function App() {
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [selectedPacks, setSelectedPacks] = useState({
        'prod-choc': 0, 'prod-van': 0, 'prod-elai': 0, 'prod-assort': 0
      });
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);
      const [user, setUser] = useState(null);
      const [authOpen, setAuthOpen] = useState(false);
      const [phoneInput, setPhoneInput] = useState('');
      const [nameInput, setNameInput] = useState('');
      const [otpStep, setOtpStep] = useState(false);
      const [otpInput, setOtpInput] = useState('');

      const [promoCode, setPromoCode] = useState('');
      const [promoApplied, setPromoApplied] = useState(false);
      const [address, setAddress] = useState('Flat 302, Greenview Apartments, Indiranagar, Bengaluru - 560038');
      const [payMethod, setPayMethod] = useState('UPI Instant (Razorpay)');
      const [checkoutSuccess, setCheckoutSuccess] = useState(null);

      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [trackOpen, setTrackOpen] = useState(false);
      const [invoiceOrder, setInvoiceOrder] = useState(null);
      const [adminMode, setAdminMode] = useState(false);
      const [newFlavour, setNewFlavour] = useState({ name: '', flavour: 'Mocha', price: 359, stock: 30 });
      const [toast, setToast] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      const addToCart = (product) => {
        const packIdx = selectedPacks[product.id] || 0;
        const pack = product.packOptions[packIdx];
        const unitPrice = Math.round(product.basePrice * pack.multiplier);
        const key = `${product.id}-${pack.size}`;

        setCart((prev) => {
          const exists = prev.find((i) => i.key === key);
          if (exists) {
            return prev.map((i) => i.key === key ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { key, productId: product.id, name: product.name, packSize: pack.size, unitPrice, qty: 1 }];
        });
        showToast(`Added ${product.flavour} (${pack.size}) to bag`);
      };

      const updateCartQty = (key, delta) => {
        setCart((prev) => prev.map((i) => i.key === key ? { ...i, qty: Math.max(0, i.qty + delta) } : i).filter((i) => i.qty > 0));
      };

      const subtotal = useMemo(() => cart.reduce((sum, i) => sum + i.unitPrice * i.qty, 0), [cart]);
      const discount = promoApplied ? Math.round(subtotal * 0.1) : 0;
      const gst = Math.round((subtotal - discount) * 0.05);
      const grandTotal = subtotal - discount + gst;
      const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);

      const handleSendOtp = (e) => {
        e.preventDefault();
        if (!phoneInput.trim()) return;
        setOtpStep(true);
        showToast('OTP sent! Use 1234 for instant demo login');
      };

      const handleVerifyOtp = (e) => {
        e.preventDefault();
        setUser({
          name: nameInput.trim() || 'Varun Khera',
          phone: phoneInput.startsWith('+91') ? phoneInput : `+91 ${phoneInput}`
        });
        setAuthOpen(false);
        setOtpStep(false);
        setOtpInput('');
        showToast('Welcome to CUP2EAT!');
      };

      const handlePlaceOrder = () => {
        if (!user) {
          setCartOpen(false);
          setAuthOpen(true);
          showToast('Please verify Phone OTP to complete order');
          return;
        }
        const newOrder = {
          id: `C2E-${Math.floor(10000 + Math.random() * 90000)}`,
          date: new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          customerName: user.name,
          customerPhone: user.phone,
          address,
          paymentMethod: payMethod,
          paymentId: `pay_${Math.random().toString(36).substring(2, 11).toUpperCase()}`,
          status: 'Order Confirmed',
          items: cart.map((c) => ({ name: c.name, packSize: c.packSize, qty: c.qty, unitPrice: c.unitPrice })),
          subtotal,
          discount,
          gst,
          total: grandTotal
        };
        setOrders([newOrder, ...orders]);
        setProducts((prev) =>
          prev.map((p) => {
            const orderedQty = cart.filter((c) => c.productId === p.id).reduce((s, c) => s + c.qty, 0);
            return orderedQty ? { ...p, stock: Math.max(0, p.stock - orderedQty) } : p;
          })
        );
        setCart([]);
        setPromoApplied(false);
        setCartOpen(false);
        setCheckoutSuccess(newOrder);
      };

      const handleAddFlavour = (e) => {
        e.preventDefault();
        if (!newFlavour.name.trim()) return;
        const created = {
          id: `prod-${Date.now()}`,
          name: newFlavour.name,
          flavour: newFlavour.flavour,
          tagline: `Artisan ${newFlavour.flavour} Wafer • Zero Waste`,
          description: `Freshly baked edible biscuit cup crafted in ${newFlavour.flavour} edition for cafés and home connoisseurs.`,
          basePrice: Number(newFlavour.price) || 349,
          rating: 5.0,
          reviews: 1,
          badge: 'New Launch',
          stock: Number(newFlavour.stock) || 25,
          sku: `C2E-NEW-${Math.floor(10 + Math.random() * 89)}`,
          accent: '#6F4E37',
          packOptions: [
            { size: 'Box of 12', count: 12, multiplier: 1, label: '' },
            { size: 'Box of 24', count: 24, multiplier: 1.85, label: 'Save 8%' },
            { size: 'Café Pack of 50', count: 50, multiplier: 3.6, label: 'Save 14%' }
          ]
        };
        setProducts([created, ...products]);
        setNewFlavour({ name: '', flavour: 'Mocha', price: 359, stock: 30 });
        showToast('New flavour published live!');
      };

      const totalRevenue = orders.reduce((s, o) => s + o.total, 0);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-20 right-5 z-50 bg-[#23150E] text-[#FAF6F0] px-4 py-3 rounded-xl shadow-2xl border border-[#C89B3C]/40 text-sm font-medium">
              ✨ {toast}
            </div>
          )}

          {/* Top Announcement Bar */}
          <div className="bg-[#23150E] text-[#FAF6F0] text-xs py-2 px-4 text-center tracking-wide">
            🌱 100% Edible • Zero Plastic Waste • Use code <span className="text-[#E5B85C] font-bold">CUP10</span> for 10% OFF your first box
          </div>

          {/* Navbar */}
          <header className="sticky top-0 z-30 bg-[#FAF6F0]/95 backdrop-blur-md border-b border-[#23150E]/10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
              <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setAdminMode(false)}>
                <div className="w-9 h-9 rounded-xl bg-[#23150E] text-[#E5B85C] flex items-center justify-center font-serif-luxury font-bold text-lg shadow">
                  C2E
                </div>
                <div>
                  <span className="font-serif-luxury font-bold text-xl tracking-tight text-[#23150E]">CUP2EAT</span>
                  <span className="hidden sm:inline-block ml-2 text-[11px] uppercase tracking-widest text-[#8C5228] font-semibold">Eat Your Drink!</span>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={() => setAdminMode(!adminMode)}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold transition border ${
                    adminMode
                      ? 'bg-[#C89B3C] text-[#23150E] border-[#C89B3C]'
                      : 'bg-white text-[#23150E] border-[#23150E]/20 hover:border-[#23150E]'
                  }`}
                >
                  {adminMode ? '← Storefront View' : '⚙️ Admin Panel'}
                </button>

                <button
                  onClick={() => setTrackOpen(true)}
                  className="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-white border border-[#23150E]/15 hover:border-[#23150E]"
                >
                  🚚 Track Order ({orders.length})
                </button>

                {user ? (
                  <button
                    onClick={() => setUser(null)}
                    className="px-3 py-1.5 rounded-full text-xs font-semibold bg-[#23150E]/10 text-[#23150E]"
                    title="Click to logout"
                  >
                    👤 {user.name.split(' ')[0]}
                  </button>
                ) : (
                  <button
                    onClick={() => setAuthOpen(true)}
                    className="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white border border-[#23150E]/20 hover:bg-[#23150E] hover:text-white transition"
                  >
                    OTP Login
                  </button>
                )}

                <button
                  onClick={() => setCartOpen(true)}
                  className="relative px-4 py-2 rounded-full bg-[#23150E] text-[#FAF6F0] text-xs font-semibold flex items-center gap-2 hover:bg-[#3B2314] transition shadow"
                >
                  <span>🛍️ Bag</span>
                  <span className="bg-[#C89B3C] text-[#23150E] font-bold px-1.5 py-0.5 rounded-full text-[11px]">
                    {totalItems}
                  </span>
                </button>
              </div>
            </div>
          </header>

          {/* OWNER ADMIN DASHBOARD */}
          {adminMode ? (
            <main className="max-w-7xl mx-auto w-full px-4 sm:px-6 py-8 space-y-8">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[#23150E]/10 pb-5">
                <div>
                  <span className="text-xs font-bold uppercase tracking-widest text-[#C89B3C]">Owner Control Center</span>
                  <h1 className="font-serif-luxury text-3xl font-bold text-[#23150E]">CUP2EAT Admin Dashboard</h1>
                </div>
                <div className="flex gap-3">
                  <div className="bg-white px-4 py-3 rounded-2xl border border-[#23150E]/10">
                    <p className="text-xs text-[#6B5344]">Total Revenue</p>
                    <p className="text-xl font-bold text-[#23150E]">₹{totalRevenue.toLocaleString('en-IN')}</p>
                  </div>
                  <div className="bg-white px-4 py-3 rounded-2xl border border-[#23150E]/10">
                    <p className="text-xs text-[#6B5344]">Active Orders</p>
                    <p className="text-xl font-bold text-[#23150E]">{orders.length}</p>
                  </div>
                </div>
              </div>

              {/* Manage Orders & Live Tracking */}
              <section className="bg-white rounded-3xl p-6 border border-[#23150E]/10 shadow-sm">
                <h2 className="font-serif-luxury text-xl font-bold mb-4">Live Orders & Status Control</h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="border-b border-[#23150E]/10 text-xs uppercase text-[#6B5344]">
                        <th className="py-3 pr-4">Order ID</th>
                        <th className="py-3 pr-4">Customer</th>
                        <th className="py-3 pr-4">Items</th>
                        <th className="py-3 pr-4">Amount</th>
                        <th className="py-3 pr-4">Tracking Stage</th>
                        <th className="py-3">Invoice</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#23150E]/10">
                      {orders.map((ord) => (
                        <tr key={ord.id}>
                          <td className="py-3.5 pr-4 font-bold">{ord.id}</td>
                          <td className="py-3.5 pr-4">
                            <div className="font-semibold">{ord.customerName}</div>
                            <div className="text-xs text-[#6B5344]">{ord.customerPhone}</div>
                          </td>
                          <td className="py-3.5 pr-4 text-xs">
                            {ord.items.map((it, idx) => (
                              <div key={idx}>{it.qty}× {it.name} ({it.packSize})</div>
                            ))}
                          </td>
                          <td className="py-3.5 pr-4 font-bold">₹{ord.total}</td>
                          <td className="py-3.5 pr-4">
                            <select
                              value={ord.status}
                              onChange={(e) => {
                                const val = e.target.value;
                                setOrders((prev) => prev.map((o) => o.id === ord.id ? { ...o, status: val } : o));
                                showToast(`Order ${ord.id} updated to ${val}`);
                              }}
                              className="bg-[#FAF6F0] border border-[#23150E]/20 rounded-lg px-2.5 py-1.5 text-xs font-semibold"
                            >
                              {STAGES.map((st) => <option key={st} value={st}>{st}</option>)}
                            </select>
                          </td>
                          <td className="py-3.5">
                            <button
                              onClick={() => setInvoiceOrder(ord)}
                              className="text-xs font-semibold underline text-[#8C5228] hover:text-[#23150E]"
                            >
                              GST Invoice
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>

              {/* Inventory & Add Flavour */}
              <div className="grid md:grid-cols-2 gap-6">
                <section className="bg-white rounded-3xl p-6 border border-[#23150E]/10 shadow-sm">
                  <h2 className="font-serif-luxury text-xl font-bold mb-4">Inventory & Stock Levels</h2>
                  <div className="space-y-3">
                    {products.map((p) => (
                      <div key={p.id} className="flex items-center justify-between p-3 rounded-2xl bg-[#FAF6F0]">
                        <div>
                          <div className="font-semibold text-sm">{p.name}</div>
                          <div className="text-xs text-[#6B5344]">SKU: {p.sku} • Base ₹{p.basePrice}</div>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => setProducts((prev) => prev.map((x) => x.id === p.id ? { ...x, stock: Math.max(0, x.stock - 5) } : x))}
                            className="w-7 h-7 rounded-lg bg-white border border-[#23150E]/20 font-bold"
                          >-</button>
                          <span className="text-xs font-bold w-16 text-center">{p.stock} boxes</span>
                          <button
                            onClick={() => setProducts((prev) => prev.map((x) => x.id === p.id ? { ...x, stock: x.stock + 5 } : x))}
                            className="w-7 h-7 rounded-lg bg-white border border-[#23150E]/20 font-bold"
                          >+</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                <section className="bg-white rounded-3xl p-6 border border-[#23150E]/10 shadow-sm">
                  <h2 className="font-serif-luxury text-xl font-bold mb-4">Launch New Flavour Box</h2>
                  <form onSubmit={handleAddFlavour} className="space-y-3">
                    <input
                      type="text"
                      required
                      placeholder="Product Title (e.g., Hazelnut Mocha Edible Cups)"
                      value={newFlavour.name}
                      onChange={(e) => setNewFlavour({ ...newFlavour, name: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-[#23150E]/20 text-sm"
                    />
                    <div className="grid grid-cols-3 gap-2">
                      <input
                        type="text"
                        placeholder="Flavour"
                        value={newFlavour.flavour}
                        onChange={(e) => setNewFlavour({ ...newFlavour, flavour: e.target.value })}
                        className="px-3 py-2.5 rounded-xl border border-[#23150E]/20 text-sm"
                      />
                      <input
                        type="number"
                        placeholder="Base Price ₹"
                        value={newFlavour.price}
                        onChange={(e) => setNewFlavour({ ...newFlavour, price: e.target.value })}
                        className="px-3 py-2.5 rounded-xl border border-[#23150E]/20 text-sm"
                      />
                      <input
                        type="number"
                        placeholder="Stock"
                        value={newFlavour.stock}
                        onChange={(e) => setNewFlavour({ ...newFlavour, stock: e.target.value })}
                        className="px-3 py-2.5 rounded-xl border border-[#23150E]/20 text-sm"
                      />
                    </div>
                    <button type="submit" className="w-full py-3 rounded-xl bg-[#23150E] text-[#FAF6F0] font-semibold text-sm hover:bg-[#3B2314]">
                      + Publish to Storefront
                    </button>
                  </form>
                </section>
              </div>
            </main>
          ) : (
            /* CUSTOMER D2C STOREFRONT */
            <main className="flex-1">
              {/* Hero Banner */}
              <section className="max-w-7xl mx-auto px-4 sm:px-6 pt-10 pb-14">
                <div className="bg-[#23150E] text-[#FAF6F0] rounded-[2rem] p-8 sm:p-14 relative overflow-hidden shadow-2xl">
                  <div className="max-w-2xl relative z-10 space-y-5">
                    <span className="inline-block px-3.5 py-1 rounded-full bg-[#C89B3C]/20 text-[#E5B85C] text-xs font-bold tracking-widest uppercase border border-[#C89B3C]/30">
                      India’s First Luxury Edible Cup Brand
                    </span>
                    <h1 className="font-serif-luxury text-4xl sm:text-6xl font-bold leading-tight">
                      Sip Your Espresso. <span className="text-[#E5B85C] italic">Crunch The Cup.</span>
                    </h1>
                    <p className="text-[#FAF6F0]/80 text-sm sm:text-base leading-relaxed">
                      Handcrafted crispy wafer biscuit cups lined with couverture cocoa. Leak-proof for 45+ minutes with piping hot coffee, masala chai, or gelato—leaving zero waste behind.
                    </p>
                    <div className="flex flex-wrap gap-3 pt-2">
                      <a href="#catalogue" className="px-6 py-3.5 rounded-full bg-[#C89B3C] text-[#23150E] font-bold text-sm hover:bg-[#E5B85C] transition shadow-lg">
                        Shop Flavour Boxes ↓
                      </a>
                      <button
                        onClick={() => setTrackOpen(true)}
                        className="px-6 py-3.5 rounded-full bg-white/10 text-white font-semibold text-sm hover:bg-white/20 transition border border-white/15"
                      >
                        Track Live Order
                      </button>
                    </div>
                  </div>
                  <div className="hidden lg:flex absolute right-12 top-1/2 -translate-y-1/2 w-72 h-72 rounded-full bg-[#C89B3C]/15 border border-[#C89B3C]/30 items-center justify-center text-8xl">
                    ☕
                  </div>
                </div>

                {/* Trust Badges */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6">
                  {[
                    ['🔥 45-Min Leak-Proof', 'Holds hot coffee & chai'],
                    ['🌾 100% Vegetarian', 'FSSAI Certified Bakery'],
                    ['♻️ Zero Plastic Waste', '100% Biodegradable & Edible'],
                    ['🚚 Pan-India Shipping', '48-Hour Dispatch']
                  ].map(([title, sub]) => (
                    <div key={title} className="bg-white rounded-2xl p-4 border border-[#23150E]/10">
                      <div className="font-bold text-sm text-[#23150E]">{title}</div>
                      <div className="text-xs text-[#6B5344] mt-0.5">{sub}</div>
                    </div>
                  ))}
                </div>
              </section>

              {/* Product Catalogue */}
              <section id="catalogue" className="max-w-7xl mx-auto px-4 sm:px-6 pb-20">
                <div className="flex flex-col sm:flex-row sm:items-end justify-between mb-8 gap-2">
                  <div>
                    <span className="text-xs font-bold uppercase tracking-widest text-[#8C5228]">Artisan Collection</span>
                    <h2 className="font-serif-luxury text-3xl sm:text-4xl font-bold text-[#23150E]">Choose Your Flavour Box</h2>
                  </div>
                  <p className="text-xs text-[#6B5344]">Select pack size (12, 24, or 50 cups) for instant café savings</p>
                </div>

                <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {products.map((product) => {
                    const activeIdx = selectedPacks[product.id] || 0;
                    const activePack = product.packOptions[activeIdx];
                    const price = Math.round(product.basePrice * activePack.multiplier);

                    return (
                      <div key={product.id} className="bg-white rounded-3xl p-5 border border-[#23150E]/10 shadow-sm hover:shadow-xl transition flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-[#FAF6F0] text-[#8C5228] border border-[#8C5228]/20">
                              {product.badge}
                            </span>
                            <span className="text-xs font-bold text-[#23150E]">★ {product.rating} ({product.reviews})</span>
                          </div>

                          <CupIllustration flavour={product.flavour} accent={product.accent} />

                          <h3 className="font-serif-luxury font-bold text-xl mt-4 text-[#23150E] leading-snug">{product.name}</h3>
                          <p className="text-xs font-semibold text-[#8C5228] mt-1">{product.tagline}</p>
                          <p className="text-xs text-[#6B5344] mt-2 leading-relaxed">{product.description}</p>

                          {/* Pack Size Selector */}
                          <div className="mt-4">
                            <div className="text-[11px] font-bold uppercase text-[#6B5344] mb-1.5">Select Pack Size:</div>
                            <div className="grid grid-cols-3 gap-1.5">
                              {product.packOptions.map((opt, idx) => (
                                <button
                                  key={opt.size}
                                  onClick={() => setSelectedPacks({ ...selectedPacks, [product.id]: idx })}
                                  className={`py-2 px-1.5 rounded-xl text-center border transition ${
                                    activeIdx === idx
                                      ? 'bg-[#23150E] text-[#FAF6F0] border-[#23150E]'
                                      : 'bg-[#FAF6F0] text-[#23150E] border-[#23150E]/15 hover:border-[#23150E]'
                                  }`}
                                >
                                  <div className="text-[11px] font-bold">{opt.count} Cups</div>
                                  {opt.label && <div className="text-[9px] text-[#E5B85C] font-semibold">{opt.label}</div>}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>

                        <div className="mt-5 pt-4 border-t border-[#23150E]/10 flex items-center justify-between">
                          <div>
                            <span className="text-2xl font-bold text-[#23150E]">₹{price}</span>
                            <span className="block text-[11px] text-[#6B5344]">₹{Math.round(price / activePack.count)} / cup • {product.stock} left</span>
                          </div>
                          <button
                            onClick={() => addToCart(product)}
                            className="px-4 py-2.5 rounded-full bg-[#23150E] text-[#FAF6F0] text-xs font-bold hover:bg-[#C89B3C] hover:text-[#23150E] transition shadow"
                          >
                            + Add Box
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            </main>
          )}

          {/* Footer */}
          <footer className="bg-[#23150E] text-[#FAF6F0]/75 py-10 px-4 sm:px-6 text-xs">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <span className="font-serif-luxury text-lg font-bold text-white">CUP2EAT – Eat Your Drink!</span>
                <p className="mt-1">Edible Biscuit Cups • FSSAI Certified • Zero Recurring Software Fee Architecture</p>
              </div>
              <div className="flex gap-4">
                <button onClick={() => setTrackOpen(true)} className="hover:text-white underline">Track Order</button>
                <button onClick={() => setAdminMode(true)} className="hover:text-white underline">Owner Admin</button>
                <a href="https://wa.me/919818192575" target="_blank" rel="noreferrer" className="hover:text-white underline">WhatsApp Concierge</a>
              </div>
            </div>
          </footer>

          {/* Floating WhatsApp Concierge */}
          <a
            href="https://wa.me/919818192575?text=Hi%20CUP2EAT!%20I%20want%20to%20order%20edible%20cup%20boxes."
            target="_blank"
            rel="noreferrer"
            className="fixed bottom-5 right-5 z-40 bg-[#25D366] text-white px-4 py-3 rounded-full shadow-2xl font-bold text-xs flex items-center gap-2 hover:scale-105 transition"
          >
            <span>💬 WhatsApp Support</span>
          </a>

          {/* OTP LOGIN MODAL */}
          {authOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl relative">
                <button onClick={() => { setAuthOpen(false); setOtpStep(false); }} className="absolute top-5 right-5 text-sm font-bold text-[#6B5344]">✕</button>
                <span className="text-xs font-bold uppercase tracking-widest text-[#C89B3C]">Instant Verification</span>
                <h3 className="font-serif-luxury text-2xl font-bold mt-1">Login via Mobile OTP</h3>
                <p className="text-xs text-[#6B5344] mt-1">No passwords to remember. Track orders & download GST invoices.</p>

                {!otpStep ? (
                  <form onSubmit={handleSendOtp} className="mt-5 space-y-3">
                    <input
                      type="text"
                      placeholder="Your Full Name"
                      value={nameInput}
                      onChange={(e) => setNameInput(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-[#23150E]/20 text-sm"
                    />
                    <input
                      type="tel"
                      required
                      placeholder="10-Digit Mobile Number (e.g. 9818192575)"
                      value={phoneInput}
                      onChange={(e) => setPhoneInput(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-[#23150E]/20 text-sm"
                    />
                    <button type="submit" className="w-full py-3.5 rounded-xl bg-[#23150E] text-white font-bold text-sm">
                      Send 4-Digit OTP →
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleVerifyOtp} className="mt-5 space-y-3">
                    <div className="text-xs bg-[#FAF6F0] p-3 rounded-xl">
                      OTP sent to <strong>{phoneInput}</strong> (Demo OTP: <strong>1234</strong>)
                    </div>
                    <input
                      type="text"
                      required
                      maxLength={4}
                      placeholder="Enter 4-digit OTP (1234)"
                      value={otpInput}
                      onChange={(e) => setOtpInput(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-[#23150E]/20 text-center tracking-[0.5em] font-bold text-lg"
                    />
                    <button type="submit" className="w-full py-3.5 rounded-xl bg-[#C89B3C] text-[#23150E] font-bold text-sm">
                      Verify & Continue
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* SLIDE-OVER CART & RAZORPAY CHECKOUT */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-end">
              <div className="bg-[#FAF6F0] w-full max-w-md h-full flex flex-col justify-between p-6 overflow-y-auto shadow-2xl">
                <div>
                  <div className="flex items-center justify-between border-b border-[#23150E]/10 pb-4">
                    <h3 className="font-serif-luxury text-2xl font-bold">Your Tasting Bag ({totalItems})</h3>
                    <button onClick={() => setCartOpen(false)} className="text-sm font-bold px-2 py-1">✕</button>
                  </div>

                  {cart.length === 0 ? (
                    <div className="py-16 text-center space-y-3">
                      <div className="text-5xl">☕</div>
                      <p className="text-sm font-semibold text-[#6B5344]">Your edible cup bag is empty.</p>
                      <button onClick={() => setCartOpen(false)} className="px-5 py-2.5 rounded-full bg-[#23150E] text-white text-xs font-bold">
                        Explore Flavours
                      </button>
                    </div>
                  ) : (
                    <div className="mt-4 space-y-4">
                      {cart.map((item) => (
                        <div key={item.key} className="bg-white p-3.5 rounded-2xl border border-[#23150E]/10 flex items-center justify-between gap-3">
                          <div>
                            <div className="font-bold text-sm">{item.name}</div>
                            <div className="text-xs text-[#6B5344]">{item.packSize} • ₹{item.unitPrice} each</div>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => updateCartQty(item.key, -1)} className="w-7 h-7 rounded-lg bg-[#FAF6F0] font-bold">-</button>
                            <span className="text-xs font-bold w-5 text-center">{item.qty}</span>
                            <button onClick={() => updateCartQty(item.key, 1)} className="w-7 h-7 rounded-lg bg-[#FAF6F0] font-bold">+</button>
                          </div>
                        </div>
                      ))}

                      {/* Promo Code */}
                      <div className="bg-white p-3.5 rounded-2xl border border-[#23150E]/10 flex gap-2">
                        <input
                          type="text"
                          placeholder="Promo code (try CUP10)"
                          value={promoCode}
                          onChange={(e) => setPromoCode(e.target.value)}
                          className="flex-1 text-xs px-3 py-2 rounded-xl bg-[#FAF6F0] uppercase font-semibold"
                        />
                        <button
                          onClick={() => {
                            if (promoCode.trim().toUpperCase() === 'CUP10') {
                              setPromoApplied(true);
                              showToast('CUP10 applied! 10% savings unlocked');
                            } else {
                              showToast('Try code CUP10');
                            }
                          }}
                          className="px-4 py-2 rounded-xl bg-[#23150E] text-white text-xs font-bold"
                        >
                          Apply
                        </button>
                      </div>

                      {/* Delivery & Payment */}
                      <div className="bg-white p-4 rounded-2xl border border-[#23150E]/10 space-y-3">
                        <div>
                          <label className="text-[11px] font-bold uppercase text-[#6B5344]">Delivery Address</label>
                          <textarea
                            rows={2}
                            value={address}
                            onChange={(e) => setAddress(e.target.value)}
                            className="w-full mt-1 p-2.5 rounded-xl bg-[#FAF6F0] text-xs"
                          />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold uppercase text-[#6B5344]">Payment Mode</label>
                          <select
                            value={payMethod}
                            onChange={(e) => setPayMethod(e.target.value)}
                            className="w-full mt-1 p-2.5 rounded-xl bg-[#FAF6F0] text-xs font-semibold"
                          >
                            <option>UPI Instant (Razorpay)</option>
                            <option>Credit / Debit Card</option>
                            <option>NetBanking</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="border-t border-[#23150E]/10 pt-4 mt-6 space-y-2 text-xs">
                    <div className="flex justify-between"><span>Subtotal</span><span>₹{subtotal}</span></div>
                    {promoApplied && <div className="flex justify-between text-emerald-700 font-semibold"><span>Promo (CUP10)</span><span>-₹{discount}</span></div>}
                    <div className="flex justify-between"><span>GST (5%)</span><span>₹{gst}</span></div>
                    <div className="flex justify-between text-base font-bold pt-2 border-t border-[#23150E]/10">
                      <span>Total Payable</span><span>₹{grandTotal}</span>
                    </div>
                    <button
                      onClick={handlePlaceOrder}
                      className="w-full mt-3 py-3.5 rounded-2xl bg-[#23150E] text-[#FAF6F0] font-bold text-sm hover:bg-[#3B2314] shadow-lg"
                    >
                      Pay ₹{grandTotal} & Generate GST Invoice →
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ORDER CONFIRMATION MODAL */}
          {checkoutSuccess && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-7 text-center shadow-2xl space-y-4">
                <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl mx-auto font-bold">✓</div>
                <h3 className="font-serif-luxury text-2xl font-bold">Order Confirmed!</h3>
                <p className="text-xs text-[#6B5344]">
                  Order <strong>{checkoutSuccess.id}</strong> is queued for fresh baking. Payment ID: <span className="font-mono">{checkoutSuccess.paymentId}</span>
                </p>
                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => { setInvoiceOrder(checkoutSuccess); setCheckoutSuccess(null); }}
                    className="flex-1 py-3 rounded-xl bg-[#23150E] text-white text-xs font-bold"
                  >
                    📄 View GST Invoice
                  </button>
                  <button
                    onClick={() => { setTrackOpen(true); setCheckoutSuccess(null); }}
                    className="flex-1 py-3 rounded-xl bg-[#FAF6F0] border border-[#23150E]/20 text-xs font-bold"
                  >
                    🚚 Track Status
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* LIVE ORDER TRACKING DRAWER */}
          {trackOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-5">
                  <h3 className="font-serif-luxury text-2xl font-bold">Live Order Tracking</h3>
                  <button onClick={() => setTrackOpen(false)} className="text-sm font-bold">✕</button>
                </div>
                <div className="space-y-5">
                  {orders.map((ord) => {
                    const currentIdx = STAGES.indexOf(ord.status);
                    return (
                      <div key={ord.id} className="p-4 rounded-2xl bg-[#FAF6F0] border border-[#23150E]/10 space-y-3">
                        <div className="flex items-center justify-between">
                          <div>
                            <span className="font-bold text-sm">{ord.id}</span>
                            <span className="text-xs text-[#6B5344] ml-2">{ord.date}</span>
                          </div>
                          <button
                            onClick={() => { setInvoiceOrder(ord); setTrackOpen(false); }}
                            className="text-xs font-bold underline text-[#8C5228]"
                          >
                            GST Invoice
                          </button>
                        </div>
                        <div className="grid grid-cols-4 gap-1.5 pt-1">
                          {STAGES.map((stage, idx) => (
                            <div key={stage} className="space-y-1">
                              <div className={`h-2 rounded-full ${idx <= currentIdx ? 'bg-[#C89B3C]' : 'bg-[#23150E]/15'}`} />
                              <div className={`text-[10px] leading-tight ${idx <= currentIdx ? 'font-bold text-[#23150E]' : 'text-[#6B5344]'}`}>
                                {stage}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* PRINTABLE GST TAX INVOICE MODAL */}
          {invoiceOrder && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div id="printable-invoice" className="space-y-5 text-xs">
                  <div className="flex justify-between items-start border-b border-gray-200 pb-4">
                    <div>
                      <h2 className="font-serif-luxury text-2xl font-bold text-[#23150E]">CUP2EAT FOODS PVT. LTD.</h2>
                      <p className="text-gray-500 mt-0.5">GSTIN: 07AABCC2E19Z5 • FSSAI: 13326009001482</p>
                      <p className="text-gray-500">New Delhi, India • support@cup2eat.in</p>
                    </div>
                    <div className="text-right">
                      <span className="px-2.5 py-1 bg-gray-100 font-bold rounded uppercase">Tax Invoice</span>
                      <p className="font-bold mt-2">#{invoiceOrder.id}</p>
                      <p className="text-gray-500">{invoiceOrder.date}</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4 bg-gray-50 p-3.5 rounded-xl">
                    <div>
                      <div className="font-bold text-gray-500 uppercase text-[10px]">Billed To</div>
                      <div className="font-bold text-sm mt-0.5">{invoiceOrder.customerName}</div>
                      <div>{invoiceOrder.customerPhone}</div>
                      <div className="text-gray-600 mt-0.5">{invoiceOrder.address}</div>
                    </div>
                    <div className="text-right">
                      <div className="font-bold text-gray-500 uppercase text-[10px]">Payment Details</div>
                      <div className="font-semibold mt-0.5">{invoiceOrder.paymentMethod}</div>
                      <div className="font-mono text-[11px] text-gray-600">{invoiceOrder.paymentId}</div>
                      <div className="text-emerald-700 font-bold mt-1">PAID</div>
                    </div>
                  </div>

                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-gray-300 text-[11px] uppercase text-gray-500">
                        <th className="py-2">Item Description</th>
                        <th className="py-2">Pack</th>
                        <th className="py-2 text-right">Qty</th>
                        <th className="py-2 text-right">Amount</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-200">
                      {invoiceOrder.items.map((it, idx) => (
                        <tr key={idx}>
                          <td className="py-2.5 font-semibold">{it.name}</td>
                          <td className="py-2.5">{it.packSize}</td>
                          <td className="py-2.5 text-right">{it.qty}</td>
                          <td className="py-2.5 text-right font-semibold">₹{it.unitPrice * it.qty}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="border-t border-gray-200 pt-3 space-y-1 text-right">
                    <div>Subtotal: <strong>₹{invoiceOrder.subtotal}</strong></div>
                    {invoiceOrder.discount > 0 && <div className="text-emerald-700">Discount: <strong>-₹{invoiceOrder.discount}</strong></div>}
                    <div>CGST + SGST (5%): <strong>₹{invoiceOrder.gst}</strong></div>
                    <div className="text-base font-bold pt-1">Grand Total: ₹{invoiceOrder.total}</div>
                  </div>
                </div>

                <div className="flex gap-3 mt-6 pt-4 border-t border-gray-200">
                  <button onClick={() => window.print()} className="flex-1 py-3 rounded-xl bg-[#23150E] text-white font-bold text-xs">
                    🖨️ Print / Save PDF
                  </button>
                  <button onClick={() => setInvoiceOrder(null)} className="px-5 py-3 rounded-xl bg-gray-100 font-bold text-xs">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
